[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "py-succinct-bitvec"
version = "1.0.0"
description = "Succinct bitvector with rank1/select1 in O(1) using blocks"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "Mahmoud ElNemer", email = "sultanelnemer@gmail.com"}]
keywords = ["python", "succinct", "bitvector", "rank-select", "data-structures"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/ElNeMeR70/py-succinct-bitvec"
Repository = "https://github.com/ElNeMeR70/py-succinct-bitvec"
